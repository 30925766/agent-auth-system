<dialog class="app-dialog" id="appDialog" aria-labelledby="appDialogTitle" aria-describedby="appDialogMessage">
    <div class="app-dialog-icon" id="appDialogIcon" aria-hidden="true"><i class="fas fa-check"></i></div>
    <h2 id="appDialogTitle">提示</h2>
    <p id="appDialogMessage"></p>
    <div class="app-dialog-detail" id="appDialogDetail" hidden></div>
    <div class="app-dialog-actions">
        <button type="button" class="app-dialog-button app-dialog-cancel" id="appDialogCancel" hidden>取消</button>
        <button type="button" class="app-dialog-button app-dialog-confirm-button" id="appDialogConfirm">知道了</button>
    </div>
</dialog>
